<main>
    <h1>Book Your Adventure</h1>
    <form>
        <label>Full Name:</label>
        <input type="text" required><br><br>

        <label>Phone:</label>
        <input type="tel" required><br><br>

        <label>Email:</label>
        <input type="email" required><br><br>

        <label>Package:</label>
        <select>
            <option>Hiking - R350</option>
            <option>Zipline - R550</option>
            <option>Climbing - R450</option>
            <option>Family Combo - R750</option>
        </select><br><br>

        <label>Date:</label>
        <input type="date" required><br><br>

        <label>People:</label>
        <input type="number" min="1"><br><br>

        <button type="submit">Confirm Booking</button>
    </form>
</main>

</body>
